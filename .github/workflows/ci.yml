name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Analyse sample images
        run: python -m precision_qc samples -o reports
      - uses: actions/upload-artifact@v4
        with:
          name: sample-reports
          path: reports/
