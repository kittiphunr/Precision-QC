name: Deploy web app to GitHub Pages

# ปิดการรันอัตโนมัติ: repo นี้ยังไม่ได้เปิด GitHub Pages (Settings → Pages → Source: GitHub Actions)
# จึงล้มที่ขั้น configure-pages ทุกครั้งที่ push เข้า main — เว็บใช้งานจริงอัปโหลดจากโฟลเดอร์ deploy/
# ถ้าเปิด Pages แล้วอยากให้ deploy อัตโนมัติอีกครั้ง ให้เพิ่ม push: branches: [main] กลับเข้ามา
# (ยังสั่งรันเองได้จากแท็บ Actions → Run workflow)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt && pytest -q
      - run: python scripts/build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
